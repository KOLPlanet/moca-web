name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: github-pages
      PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      PUBLIC_CONTACT_ENDPOINT: ${{ vars.PUBLIC_CONTACT_ENDPOINT }}
      PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.PUBLIC_GOOGLE_ANALYTICS_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public deployment variables
        run: |
          if [[ -z "$PUBLIC_SITE_URL" || -z "$PUBLIC_CONTACT_ENDPOINT" ]]; then
            echo "::error::Configure PUBLIC_SITE_URL and PUBLIC_CONTACT_ENDPOINT as repository variables."
            exit 1
          fi

      - name: Build and upload Astro site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    if: vars.DEPLOY_TARGET == 'github-pages'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
